# Configuración del sitio en Render (https://render.com).
# El despliegue lo dispara GitHub Actions cuando la compilación pasa (ver .github/workflows/ci-cd.yml).
services:
  - type: web
    name: hakan-frontend
    runtime: static
    branch: main
    autoDeploy: false
    buildCommand: npx --yes pnpm@11.7.0 install --frozen-lockfile && npx --yes pnpm@11.7.0 build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    # React Router: cualquier ruta (/carrito, /producto/1...) carga index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
